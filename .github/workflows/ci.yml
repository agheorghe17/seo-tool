name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm test

      # Fails if the committed migrations are out of sync with the schema.
      - name: Drizzle schema/migration drift check
        run: |
          pnpm --filter db build
          pnpm --filter db exec drizzle-kit generate --name ci-drift-check
          git diff --exit-code packages/db/migrations
        env:
          DATABASE_URL_DIRECT: postgresql://user:pass@localhost:5432/db
